<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Điểu Gia Bảo - Portfolio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;}

body{
font-family:'Segoe UI',sans-serif;
background:black;
color:white;
overflow-x:hidden;
}

/* Scroll đẹp */
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:#00f2ff;border-radius:10px;}
::-webkit-scrollbar-track{background:black;}

#bgVideo{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-3;
}

/* Overlay nhạc */
#musicOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
display:flex;
justify-content:center;
align-items:center;
z-index:2000;
font-size:28px;
font-weight:bold;
color:#00f2ff;
cursor:pointer;
transition:opacity 0.8s ease;
}
#musicOverlay.hide{
opacity:0;
pointer-events:none;
}

/* NAVBAR NÂNG CẤP */
.navbar{
margin-top:25px;
text-align:center;
}

.navbar a{
color:#00f2ff;
text-decoration:none;
margin:0 15px;
font-weight:bold;
padding:8px 15px;
border-radius:10px;
position:relative;
transition:0.3s;
}

/* Hiệu ứng neon */
.navbar a::before{
content:"";
position:absolute;
inset:0;
border-radius:10px;
background:linear-gradient(45deg,#00f2ff,transparent,#00f2ff);
opacity:0;
transition:0.4s;
}

.navbar a:hover::before{
opacity:1;
filter:blur(8px);
}

.navbar a:hover{
color:white;
box-shadow:0 0 15px #00f2ff,0 0 25px #00f2ff;
transform:translateY(-2px);
}

/* PAGE */
.page{
display:none;
min-height:100vh;
padding:120px 20px 80px 20px;
justify-content:center;
align-items:flex-start;
}
.active{
display:flex;
animation:fade 0.6s ease;
}
@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

/* BOX glow */
.box{
background:rgba(0,0,0,0.5);
backdrop-filter:blur(6px);
padding:35px;
border-radius:20px;
max-width:1100px;
box-shadow:0 0 25px rgba(0,242,255,0.4);
line-height:1.7;
transition:0.4s;
}

.box:hover{
box-shadow:0 0 40px rgba(0,242,255,0.7);
}

/* INTRO */
.intro{
display:flex;
gap:40px;
flex-wrap:wrap;
}
.intro img{
width:260px;
border-radius:15px;
box-shadow:0 0 20px #00f2ff;
transition:0.4s;
}
.intro img:hover{
transform:scale(1.05);
box-shadow:0 0 40px #00f2ff;
}

/* SOCIAL ICON nâng cấp */
.social{
margin-top:20px;
display:flex;
gap:20px;
align-items:center;
}

.social a{
position:relative;
}

.social img{
width:40px;
height:40px;
border-radius:50%;
transition:0.4s;
}

/* glow vòng ngoài */
.social a::before{
content:"";
position:absolute;
top:-5px;left:-5px;
right:-5px;bottom:-5px;
border-radius:50%;
background:linear-gradient(45deg,#00f2ff,transparent,#00f2ff);
opacity:0;
filter:blur(10px);
transition:0.4s;
}

.social a:hover::before{
opacity:1;
}

.social img:hover{
transform:scale(1.2) rotate(5deg);
box-shadow:0 0 15px #00f2ff,0 0 30px #00f2ff;
}

/* TEXT */
.highlight{
color:#00f2ff;
font-weight:bold;
margin-top:15px;
}
.prepare-list{margin-top:10px;padding-left:20px;}
.prepare-list li{margin-bottom:8px;}
</style>
</head>
<body>

<div id="musicOverlay">Chạm vào màn hình để bật nhạc</div>

<video id="bgVideo" autoplay loop playsinline muted>
<source src="./snaptik.vn_cwAXi.mp4" type="video/mp4">
</video>

<!-- PAGE 1 -->
<div id="page1" class="page active">
<div class="box">
<h1>Giới Thiệu Bản Thân</h1>

<div class="intro">
<img src="./retouch_2026020222520653.jpg">

<div>
<p><b>Họ và tên:</b> Điểu Gia Bảo</p>
<p><b>Lớp:</b> 12XH1A</p>
<p><b>Trường:</b> THCS & THPT Việt Hoa Quang Chánh</p>

<!-- MENU -->
<div class="navbar">
<a href="#" onclick="showPage(1)">Trang Chủ</a>
<a href="#" onclick="showPage(2)">Kỳ Thi</a>
<a href="#" onclick="showPage(3)">Hành Trang</a>
</div>

<!-- SOCIAL -->
<div class="social">
<a href="https://www.facebook.com/share/14aBRYBcUNa/" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">
</a>

<a href="https://tiktok.com/@giabaoo1605" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/3046/3046126.png">
</a>

<a href="mailto:dgbaoo2k8@gmail.com">
<img src="https://cdn-icons-png.flaticon.com/512/732/732200.png">
</a>
</div>

<h3 class="highlight">⏳ Đếm ngược đến kỳ thi:</h3>
<p id="countdown"></p>

</div>
</div>
</div>
</div>

<script>
function showPage(p){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById("page"+p).classList.add("active");
window.scrollTo({top:0,behavior:'smooth'});
}

function countdown(){
let target=new Date("June 11, 2026 07:00:00").getTime();
let now=new Date().getTime();
let diff=target-now;
let d=Math.floor(diff/(1000*60*60*24));
let h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((diff%(1000*60*60))/(1000*60));
let s=Math.floor((diff%(1000*60))/1000);
document.getElementById("countdown").innerHTML=
d+" ngày "+h+" giờ "+m+" phút "+s+" giây";
}
setInterval(countdown,1000);
countdown();

const video=document.getElementById("bgVideo");
const overlay=document.getElementById("musicOverlay");

overlay.addEventListener("click",function(){
video.muted=false;
video.volume=1;
video.play();
overlay.classList.add("hide");
setTimeout(()=>overlay.style.display="none",800);
});
</script>

</body>
</html>
