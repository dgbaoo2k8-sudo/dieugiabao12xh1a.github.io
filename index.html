<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Demo</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            background: #555;
        }

        nav a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
        }

        nav a:hover {
            background: #777;
        }

        .hero {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            padding: 80px 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: #f4f4f4;
            padding: 20px;
            margin: 10px;
            border-radius: 10px;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
        }

        .grid .card {
            flex: 1 1 30%;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #007BFF;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<header>
    <h1>Trang Web Của Bạn</h1>
</header>

<nav>
    <a href="#">Trang chủ</a>
    <a href="#">Giới thiệu</a>
    <a href="#">Dịch vụ</a>
    <a href="#">Liên hệ</a>
</nav>

<section class="hero">
    <h2>Chào mừng bạn</h2>
    <p>Đây là trang web mẫu 1 file duy nhất</p>
    <button onclick="showAlert()">Bấm vào đây</button>
</section>

<div class="container">
    <h2>Nội dung</h2>
    <div class="grid">
        <div class="card">Box 1</div>
        <div class="card">Box 2</div>
        <div class="card">Box 3</div>
    </div>
</div>

<footer>
    <p>© 2026 - Demo</p>
</footer>

<script>
    function showAlert() {
        alert("Bạn vừa bấm nút!");
    }
</script>

</body>
  </html>
